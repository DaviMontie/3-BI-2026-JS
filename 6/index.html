<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercício 6</title>
</head>
<body>

    <h1>Gerador de Aventuras</h1>

    <button id="gerar">Gerar aventura</button>

    <p id="resultado"></p>

    <script>
        const acoes = [
            "A Busca",
            "A Batalha",
            "O Resgate"
        ];

        const locais = [
            "na Floresta Sombria",
            "no Reino Perdido",
            "na Montanha Misteriosa"
        ];

        const complementos = [
            "do Dragão",
            "do Tesouro Esquecido",
            "da Espada Ancestral"
        ];

        const botao = document.querySelector("#gerar");
        const resultado = document.querySelector("#resultado");

        botao.addEventListener("click", function() {

            const acao = acoes[Math.floor(Math.random() * acoes.length)];

            const local = locais[Math.floor(Math.random() * locais.length)];

            const complemento = complementos[
                Math.floor(Math.random() * complementos.length)
            ];

            resultado.textContent =
                acao + " " + local + " " + complemento;
        });
    </script>

</body>
</html>
